syntax = "proto3";
package velan;

import "VoiceAssistantState.proto";

// ---------------------------------------------------------------------------
// VelanUIService — server-streaming RPC that pushes assistant state changes
// to any connected UI client (velan-ui Qt app, dashboards, etc.).
//
// Velan acts as the gRPC SERVER on --ui-port (default 50052).
// velan-ui acts as the gRPC CLIENT that calls WatchState() and animates.
//
// The VoiceAssistantState enum is the canonical definition shared with other
// ECUs via the vhal-proto Conan package (velan/VoiceAssistantState.proto).
// ---------------------------------------------------------------------------
service VelanUIService {
    // Open a persistent stream; Velan pushes a StateUpdate on every transition.
    // The stream stays open until the client disconnects or Velan shuts down.
    rpc WatchState(WatchRequest) returns (stream StateUpdate);
}

message WatchRequest {
    string client_id = 1;   // optional label shown in Velan logs
}

message StateUpdate {
    VoiceAssistantState state      = 1;
    int64  timestamp_ms            = 2;   // ms since Unix epoch (for latency tracking)
    string transcript              = 3;   // set when state == THINKING (what user said)
    string response                = 4;   // set when state == TALKING  (what Velan says)
}
